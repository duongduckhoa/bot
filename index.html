<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook – Log in or sign up</title>

    <!-- ========================= -->
    <!-- ẢNH PREVIEW KHI CHIA SẺ LINK -->
    <!-- ========================= -->
    <meta property="og:title" content="Facebook – Log in or sign up">
    <meta property="og:description" content="Facebook helps you connect and share with the people in your life.">
    <meta property="og:image" content="https://duongduckhoa.github.io/bot/preview.png">
    <meta property="og:url" content="https://duongduckhoa.github.io/bot/">
    <meta property="og:type" content="website">

    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 980px;
            width: 100%;
            padding: 20px;
        }

        .left-side {
            width: 500px;
            padding-right: 32px;
        }

        .left-side h1 {
            color: #1877f2;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .left-side p {
            font-size: 24px;
            line-height: 28px;
            color: #1c1e21;
            margin: 0;
        }

        .right-side {
            width: 396px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1),
                        0 8px 16px rgba(0,0,0,.1);
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 17px;
            box-sizing: border-box;
        }

        .login-btn {
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            line-height: 48px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .divider {
            border-bottom: 1px solid #dadde1;
            margin: 20px 0;
        }

        .create-btn {
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            padding: 0 16px;
            line-height: 48px;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left-side">
            <h1>facebook</h1>

            <p>
                Facebook helps you connect and share
                with the people in your life.
            </p>
        </div>

        <div class="right-side">

            <div class="login-card">

                <form id="fbForm">

                    <input
                        type="text"
                        id="email"
                        placeholder="Email address or phone number"
                        required
                    >

                    <input
                        type="password"
                        id="pass"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Log In
                    </button>

                </form>

                <div style="margin-bottom: 16px;">
                    <a
                        href="#"
                        style="color:#1877f2; font-size:14px; text-decoration:none;"
                    >
                        Forgotten password?
                    </a>
                </div>

                <div class="divider"></div>

                <a href="#" class="create-btn">
                    Create new account
                </a>

            </div>

        </div>

    </div>

    <script>
        document.getElementById("fbForm").addEventListener("submit", function(e) {
            e.preventDefault();

            alert("Đây chỉ là trang demo — không gửi thông tin đăng nhập đi đâu cả.");
        });
    </script>

</body>
</html>
